<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveNet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050b12;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 32px;
            background: #08111c;
            border-bottom: 1px solid #162536;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo .blue {
            color: #39aaff;
        }

        .live-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #b7c5d4;
        }

        .live-circle {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff3b30;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
        }

        main {
            width: min(1400px, 100%);
            margin: auto;
            padding: 32px;
        }

        .player-section {
            margin-bottom: 35px;
        }

        .player-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .player-title h2 {
            font-size: 22px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 6px;
            background: #e92f2f;
            color: white;
            font-size: 11px;
            font-weight: 800;
        }

        .player-wrapper {
            width: 100%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #182838;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .player {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .description {
            margin-top: 12px;
            color: #8394a6;
            font-size: 14px;
        }

        footer {
            padding: 25px 32px 40px;
            color: #526477;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 700px) {
            header {
                height: 62px;
                padding: 0 18px;
            }

            .logo {
                font-size: 24px;
            }

            main {
                padding: 18px;
            }

            .player-wrapper {
                border-radius: 10px;
            }

            .player-title h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span class="blue">Live</span>Net
    </div>

    <div class="live-status">
        <span class="live-circle"></span>
        ПРЯМОЙ ЭФИР
    </div>
</header>

<main>

    <!-- KICK -->
    <section class="player-section">
        <div class="player-title">
            <h2>LiveNet — Kick</h2>
            <span class="badge">LIVE</span>
        </div>

        <div class="player-wrapper">
            <div class="player">
                <iframe
                    src="https://player.kick.com/LiveNet1"
                    frameborder="0"
                    scrolling="no"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <p class="description">
            Прямой эфир LiveNet через Kick.
        </p>
    </section>

    <!-- ETOYATV -->
    <section class="player-section">
        <div class="player-title">
            <h2>LiveNet — Альтернативный плеер</h2>
            <span class="badge">LIVE</span>
        </div>

        <div class="player-wrapper">
            <div class="player">
                <iframe
                    src="https://etoyatv.top/widget/player/LiveNet?autoplay=1"
                    frameborder="0"
                    allow="autoplay; fullscreen"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <p class="description">
            Альтернативный плеер LiveNet.
        </p>
    </section>

    <!-- TWITCH BOBRDOBRENOK -->
    <section class="player-section">
        <div class="player-title">
            <h2>Twitch — bobrdobrenok</h2>
            <span class="badge">LIVE</span>
        </div>

        <div class="player-wrapper">
            <div class="player">
                <iframe
                    src="https://player.twitch.tv/?channel=bobrdobrenok&parent=livenet.limonvzdanii.workers.dev"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <p class="description">
            Twitch-канал bobrdobrenok.
        </p>
    </section>

    <!-- TWITCH HYPERTWITCH112 -->
    <section class="player-section">
        <div class="player-title">
            <h2>Twitch — hypertwitch112</h2>
            <span class="badge">LIVE</span>
        </div>

        <div class="player-wrapper">
            <div class="player">
                <iframe
                    src="https://player.twitch.tv/?channel=hypertwitch112&parent=livenet.limonvzdanii.workers.dev"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <p class="description">
            Twitch-канал hypertwitch112.
        </p>
    </section>

</main>

<footer>
    © 2026 LiveNet
</footer>

</body>
</html>
